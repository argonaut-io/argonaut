name: scala-steward
on:
  push:
    branches: [ master ]
  schedule:
  - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  scala-steward:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'argonaut-io' }}
    steps:
    - name: Generate token
      id: generate_token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: 89628
        private-key: ${{ secrets.ARGONAUT_BOT_KEY }}
    - name: Launch Scala Steward
      uses: scala-steward-org/scala-steward-action@3e5cae868160200afda12b57c150e56cede989ab # v2.97.0
      with:
        github-token: ${{ steps.generate_token.outputs.token }}
        author-email: "74832392+argonaut-bot[bot]@users.noreply.github.com"
        author-name: argonaut-bot[bot]
