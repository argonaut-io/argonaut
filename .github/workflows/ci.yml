name: CI
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 17
          - java: 25
    steps:
    - uses: actions/checkout@v7.0.1
    - run: |
        gh extension install github/gh-actions-lock
        gh actions-lock --verify
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/setup-java@v6.2.0
      with:
        java-version: ${{matrix.java}}
        distribution: zulu
    - uses: coursier/cache-action@v9.0.1
    - run: ./sbt -v
           --server
           -jvm-opts .github/workflows/.jvmopts
           scalafmtSbtCheck
           scalafmtCheckAll
           mimaReportBinaryIssues
           Test/compile
           test
           publishLocal
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.2.0
      with:
        java-version: 21
        distribution: temurin
    - uses: coursier/cache-action@v9.0.1
    - run: ./sbt -v
           --server
           -jvm-opts .github/workflows/.jvmopts
           -Dargonaut_scala_3_version=3.10.1
           scalafmtCheckAll
           Test/compile
           test
           publishLocal
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.2.0
      with:
        java-version: 21
        distribution: temurin
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 26
    - uses: coursier/cache-action@v9.0.1
    - run: ./sbt -v
           --server
           -jvm-opts .github/workflows/.jvmopts
           -Dscala_js_wasm
           "...JS3/test"
